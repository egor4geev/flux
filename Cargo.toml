[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
flux-core = { path = "crates/flux-core" }
flux-syntax = { path = "crates/flux-syntax" }
tree-sitter = "0.27.0"
tree-sitter-bash = "0.25.1"
tree-sitter-go = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-json = "0.24.8"
tree-sitter-md = "0.5.3"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-yaml = "0.7.2"

# Разбор и запросы tree-sitter — C-код; без оптимизаций отладочная сборка
# разбирает в разы медленнее. Оптимизируем только эти крейты.
[profile.dev.package.tree-sitter]
opt-level = 3
[profile.dev.package.tree-sitter-bash]
opt-level = 3
[profile.dev.package.tree-sitter-go]
opt-level = 3
[profile.dev.package.tree-sitter-javascript]
opt-level = 3
[profile.dev.package.tree-sitter-json]
opt-level = 3
[profile.dev.package.tree-sitter-md]
opt-level = 3
[profile.dev.package.tree-sitter-python]
opt-level = 3
[profile.dev.package.tree-sitter-rust]
opt-level = 3
[profile.dev.package.tree-sitter-toml-ng]
opt-level = 3
[profile.dev.package.tree-sitter-typescript]
opt-level = 3
[profile.dev.package.tree-sitter-yaml]
opt-level = 3
