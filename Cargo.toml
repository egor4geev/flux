[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
flux-claude = { path = "crates/flux-claude" }
flux-core = { path = "crates/flux-core" }
flux-fs = { path = "crates/flux-fs" }
flux-git = { path = "crates/flux-git" }
flux-lsp = { path = "crates/flux-lsp" }
flux-plugin = { path = "crates/flux-plugin" }
flux-syntax = { path = "crates/flux-syntax" }
flux-search = { path = "crates/flux-search" }
flux-term = { path = "crates/flux-term" }
# `wasm`: grammars compiled to WebAssembly, run on wasmtime 48 (`wasmtime-c-api-impl`); the
# plugins' wasmtime (flux-plugin) stays on the same major, so Flux has one. Building it needs cmake.
tree-sitter = { version = "0.27.1", features = ["wasm"] }
tree-sitter-bash = "0.25.1"
tree-sitter-go = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-json = "0.24.8"
tree-sitter-md = "0.5.3"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-yaml = "0.7.2"

# Parsing and queries in tree-sitter are C code; without optimizations a debug build parses several
# times slower. Only these crates are optimized.
[profile.dev.package.tree-sitter]
opt-level = 3
[profile.dev.package.tree-sitter-bash]
opt-level = 3
[profile.dev.package.tree-sitter-go]
opt-level = 3
[profile.dev.package.tree-sitter-javascript]
opt-level = 3
[profile.dev.package.tree-sitter-json]
opt-level = 3
[profile.dev.package.tree-sitter-md]
opt-level = 3
[profile.dev.package.tree-sitter-python]
opt-level = 3
[profile.dev.package.tree-sitter-rust]
opt-level = 3
[profile.dev.package.tree-sitter-toml-ng]
opt-level = 3
[profile.dev.package.tree-sitter-typescript]
opt-level = 3
[profile.dev.package.tree-sitter-yaml]
opt-level = 3

# Search (flux-search): the regular expression engine, substring search, and fuzzy search. In a
# debug build without optimizations they are 10–15 times slower: searching a 50k-line file takes 10
# ms instead of 1, matching 36k paths takes 20–30 ms per letter. regex-automata, aho-corasick, and
# memchr are needed by gpui too: the dependent crates will be rebuilt once.
[profile.dev.package.regex-automata]
opt-level = 3
[profile.dev.package.regex-syntax]
opt-level = 3
[profile.dev.package.aho-corasick]
opt-level = 3
[profile.dev.package.memchr]
opt-level = 3
[profile.dev.package.grep-searcher]
opt-level = 3
[profile.dev.package.grep-regex]
opt-level = 3
[profile.dev.package.grep-matcher]
opt-level = 3
[profile.dev.package.nucleo]
opt-level = 3
[profile.dev.package.nucleo-matcher]
opt-level = 3
# File tree (flux-fs): .gitignore rules applied when reading a directory. Without optimizations, a
# directory of 10k files takes ~145 ms to read instead of 13.
[profile.dev.package.ignore]
opt-level = 3
[profile.dev.package.globset]
opt-level = 3
# Terminal (flux-term): the VT parser and the grid. In a debug build without optimizations a burst of
# output (`cat` of a large file, a build log) is parsed several times slower than it arrives.
# alacritty_terminal's parser, grid, and search are generic over the event listener, so they are
# compiled into flux-term: it needs the optimizations too (otherwise output is parsed ~4.5× and
# searched ~6× slower).
[profile.dev.package.alacritty_terminal]
opt-level = 3
[profile.dev.package.vte]
opt-level = 3
[profile.dev.package.flux-term]
opt-level = 3
# Plugins (flux-plugin): Cranelift compiles a plugin's component when it is loaded the first time
# (then it comes from the cache). Without optimizations a debug build compiles a component several
# times slower; the code it generates is the same.
[profile.dev.package.cranelift-codegen]
opt-level = 3
[profile.dev.package.cranelift-frontend]
opt-level = 3
[profile.dev.package.regalloc2]
opt-level = 3
[profile.dev.package.wasmtime-internal-cranelift]
opt-level = 3
[profile.dev.package.wasmparser]
opt-level = 3
# WebAssembly grammars (flux-syntax, stage 8.3): a grammar is compiled by the same Cranelift, and a
# parse calls into wasmtime for every token. Without these a debug build loads grammars ~20 times
# slower (12 grammars: 5.3 s instead of 0.27 s) and parses 12–21 times slower than a release build.
[profile.dev.package.cranelift-entity]
opt-level = 3
[profile.dev.package.cranelift-bforest]
opt-level = 3
[profile.dev.package.cranelift-bitset]
opt-level = 3
[profile.dev.package.cranelift-control]
opt-level = 3
[profile.dev.package.cranelift-native]
opt-level = 3
[profile.dev.package.wasmtime]
opt-level = 3
[profile.dev.package.wasmtime-environ]
opt-level = 3
[profile.dev.package.wasmtime-c-api-impl]
opt-level = 3
[profile.dev.package.wasmtime-internal-core]
opt-level = 3
[profile.dev.package.wasmtime-internal-unwinder]
opt-level = 3
[profile.dev.package.wasmtime-internal-jit-icache-coherence]
opt-level = 3
[profile.dev.package.wasmtime-internal-jit-debug]
opt-level = 3
[profile.dev.package.gimli]
opt-level = 3
[profile.dev.package.object]
opt-level = 3
# The cache of compiled grammars: a grammar's hash, its compressed machine code.
[profile.dev.package.wasmtime-internal-cache]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.zstd-sys]
opt-level = 3
