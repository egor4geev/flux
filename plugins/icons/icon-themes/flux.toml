# Flux Icons: the set `docs/icon-themes.md` describes. A color is a shade of the theme's palette, so
# the icons follow light and dark themes. Order: exact file names, then name prefixes, then
# extensions; anything else — Flux's plain file icon (the set has no defaults: folders and unknown
# files keep the plain ones).
name = "Flux Icons"

[file-names]
"cargo.toml" = { icon = "icons/package.svg", color = "orange" }
"package.json" = { icon = "icons/package.svg", color = "red" }
"cargo.lock" = { icon = "icons/lock.svg", color = "dim" }
