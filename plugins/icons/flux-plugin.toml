# Flux's own file icons (stage 8.3): the bundled set, as an icon theme of Zed or an icon pack of
# JetBrains IDEs. Other sets come from the catalog and are chosen in Settings → Appearance → File
# Icons. Turned off, files and folders get Flux's plain icons. The glyphs are generated by
# `scripts/gen-icons.py`; monochrome, colored by the theme's palette, so they follow light and dark
# themes.
id = "flux.icons"
name = "Flux Icons"
version = "0.1.0"
api = "0.2"
authors = ["Egor Ageev"]
description = "Flux's own file icons: a glyph for every common kind of file, in the colors of the theme."
repository = "https://github.com/egor4geev/flux"
icon = "icons/image.svg"

[[icon-themes]]
file = "icon-themes/flux.toml"
