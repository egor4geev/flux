# The Russian interface of the TODO plugin: English text = translation. Flux translates the
# manifest's strings with this table too (the palette, Settings).

# The manifest
"TODO and FIXME comments of the project in a tool window, as in JetBrains IDEs: grouped by file, with a jump to the place." = "Комментарии TODO и FIXME проекта в окне инструмента, как в IDE JetBrains: по файлам, с переходом к месту."
"Refresh TODO" = "Обновить TODO"
"Patterns" = "Шаблоны"
"Regular expressions that mark a TODO item, one per row." = "Регулярные выражения, которыми отмечены TODO, по одному в строке."
"Case-sensitive patterns" = "Учитывать регистр"
"Without it, TODO, Todo and todo are all found." = "Без этого находятся и TODO, и Todo, и todo."

