[package]
name = "flux-fs"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
flux-platform.workspace = true
ignore = "0.4.33"
# Renaming without overwriting an existing file: `renamex_np` (macOS), `renameat2` (Linux).
libc = "0.2.190"
# Watching project files: FSEvents on macOS.
notify = "8.2.0"
# Moving to the Trash; on macOS, `NSFileManager trashItemAtURL` (without a permission request).
# Windows: the shell's file operation is a COM object — initialized single-threaded, as the
# windowed app's main thread already is.
trash = { version = "5.2.9", default-features = false, features = ["coinit_apartmentthreaded"] }

[dev-dependencies]
tempfile = "3"
