[package]
name = "flux-claude"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Pictures in the user's messages go to the CLI as base64.
base64 = "0.22"
# Channels from the CLI's reader thread to the window's UI tasks: futures, no async runtime (as
# flux-lsp, ADR-019).
futures = "0.3.34"
# `!` commands (part 10.2): Stop signals the command's whole process group.
libc = "0.2"
serde_json = "1"
# The country check (part «Флаг страны»): the same client as flux-update's — rustls with ring, the
# system's certificates.
ureq = { version = "3.4", default-features = false, features = [
    "_ring",
    "platform-verifier",
    "rustls-no-provider",
] }

[dev-dependencies]
tempfile = "3"
