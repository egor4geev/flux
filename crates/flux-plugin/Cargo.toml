[package]
name = "flux-plugin"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
flux-platform.workspace = true
# The plugin's stdout and stderr: the stream types of `wasmtime-wasi` (already in its tree).
bytes = "1"
flux-search.workspace = true
# Channels from the plugins' threads to the window's UI tasks.
futures = "0.3.34"
# The requests to the plugins' servers (`server`): the head of a request (already in Flux's tree).
httparse = "1"
# The plugins' programs (`process`): their process groups and signals.
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Flux's log (`flux.log`): what happens to the plugins' secrets (already in Flux's tree).
log = "0.4"
# Only the `AsyncWrite` trait of the stdout and stderr streams (`wasmtime-wasi` runs on tokio).
tokio = { version = "1", default-features = false }
toml = "1"
# The plugins' WebSocket connections to their server (`server`): frames over a socket Flux
# accepts and upgrades itself; `handshake` only for the accept key (SHA-1).
tungstenite = "0.30"
# The plugins' requests (`http`): a synchronous client (no async runtime), TLS by rustls with ring
# (both already in Flux's tree, through gpui) checked by the system's certificates (the platform
# verifier: Security.framework on macOS, so a company's root certificates work); gzip bodies.
ureq = { version = "3.4", default-features = false, features = [
    "_ring",
    "gzip",
    "platform-verifier",
    "rustls-no-provider",
] }
# The catalog's packages (stage 8.3): their SHA-256 is checked before installing; the plugins'
# secrets are sealed with ChaCha20-Poly1305 (ring is in Flux's tree already, through rustls).
ring = "0.17.14"
# Redirects (a relative `Location` against the request's URL) and the URLs of the plugins' requests.
url = "2"
# The plugins' runtime: WebAssembly components (ADR-029). Only what Flux needs: the component
# model compiled by Cranelift; no WAT, threads, profiling or the async component model. The major
# version is the one tree-sitter's `wasm` feature is built on (`wasmtime-c-api-impl` 48, which also
# turns on `gc` and `gc-null`): one wasmtime in Flux, not two. Move them together.
wasmtime = { version = "48.0.5", default-features = false, features = [
    "anyhow",
    "backtrace",
    "component-model",
    "cranelift",
    "parallel-compilation",
    "runtime",
    "std",
] }
# WASI 0.2 for the plugins: the file system (the project, the plugin's folder), clocks, random,
# stdout and stderr into the plugin's log.
wasmtime-wasi = { version = "48.0.5", default-features = false, features = ["p2"] }

# Windows (part 10.9): DPAPI seals the secrets' key.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
