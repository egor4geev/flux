[package]
name = "flux-remote-playground"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Every Claude session of Flux in one window, with a button for every call of the remote-work API: the manual check of the plugin API 0.6."

[lib]
crate-type = ["cdylib"]
doctest = false

[dependencies]
flux-plugin-api = { path = "../../crates/flux-plugin-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Plugins are small: Flux compiles the component when it loads it.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

# A plugin is a project of its own: `cargo build --release --target wasm32-wasip2`, or installed as
# a plugin under development, Flux builds it.
[workspace]
